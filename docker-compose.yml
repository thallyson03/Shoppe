services:
  postgres:
    image: postgres:16-alpine
    container_name: shopee-offers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopee
      POSTGRES_PASSWORD: shopee
      POSTGRES_DB: shopee_offers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopee -d shopee_offers"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopee-offers-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://shopee:shopee@postgres:5432/shopee_offers?schema=public
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
